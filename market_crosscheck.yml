name: V1 Market Price Crosscheck Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data library
        run: python -m pip install pykrx pandas requests
      - name: Offline regression tests
        run: python -m unittest -v test_market_crosscheck.py
      - name: Live same-day crosscheck (diagnostic only)
        run: python market_crosscheck.py --output output/market_crosscheck
      - name: Save results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-market-crosscheck-${{ github.run_id }}
          path: output/market_crosscheck/**
          retention-days: 30
          if-no-files-found: warn
