name: V1.0 Daily Market Collector

on:
  workflow_dispatch:

  schedule:
    # 18:20 KST = 09:20 UTC
    # Monday-Friday
    - cron: "20 9 * * 1-5"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V1.0 market collector
        run: |
          python collector.py

      - name: Upload validated market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-market-data-${{ github.run_id }}
          path: |
            output/**
          retention-days: 90
          if-no-files-found: warn
