name: V1.0 Daily Free Web Collector

on:
  workflow_dispatch:

  schedule:
    # 18:20 KST = 09:20 UTC, Monday-Friday
    - cron: "20 9 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V1.0 free web collector
        run: |
          python collector.py

      - name: Upload collector output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-market-data-${{ github.run_id }}
          path: |
            output/**
          retention-days: 90
          if-no-files-found: warn

      - name: Commit public market output
        if: always()
        shell: bash
        run: |
          if [ -d output ] && [ "$(find output -type f | head -n 1)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p data
            cp -f output/* data/ || true
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "data: daily market snapshot $(date +'%Y-%m-%d')"
              git push
            else
              echo "No data changes to commit."
            fi
          fi
