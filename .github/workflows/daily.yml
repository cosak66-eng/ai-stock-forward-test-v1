name: V1.0 Controlled Free Web Collector

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Manual runs are diagnostic only and never prediction-eligible."
        required: false
        default: "diagnostic"

  schedule:
    # Start the runner earlier; the frozen capture window is unchanged.
    # UTC 05:45 = 14:45 KST; 06:05/20 are redundant wake-ups.
    # This mitigates observed 31-37 minute queue delays without accepting late data.
    - cron: "45 5 * * 1-5"
    - cron: "5,20 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v1-controlled-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deterministic self-test
        run: |
          python collector.py --self-test
          python -m unittest -v test_shared_market_data.py test_v1_shared_integration.py

      - name: Run controlled collector
        id: collector
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python collector.py --mode scheduled
          else
            echo "Manual workflow_dispatch = DIAGNOSTIC ONLY"
            python collector.py --mode diagnostic
          fi

      - name: Preserve run and attempt source evidence
        if: always()
        run: python shared_run_manifest.py --code-sha "$(git rev-parse HEAD)"

      - name: Upload run output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-controlled-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/**
          retention-days: 90
          if-no-files-found: warn

      - name: Commit scheduled data or manual diagnostic log
        if: always()
        shell: bash
        run: |
          if [ ! -d output ] || [ "$(find output -type f | head -n 1)" = "" ]; then
            echo "No output to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            mkdir -p data
            cp -f output/* data/ || true
            git add data
          else
            mkdir -p run_logs
            cp -f output/* run_logs/ || true
            git add run_logs
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: controlled V1.0 collector $(date +'%Y-%m-%d %H:%M:%S')"

          # A previous queued run may have committed after this run was triggered.
          # Rebase onto the newest main before push to avoid non-fast-forward errors.
          git pull --rebase origin main
          git push origin HEAD:main
